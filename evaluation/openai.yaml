# Real-model routing evaluation config. Prices are OpenAI list prices per 1M
# tokens (checked 2026-10-16). Reliability values are deliberately rough priors:
# `routemcp evaluate --calibration-fraction` replaces quality with measured pass
# rates per task type, and live traffic replaces latency and success rate.
models:
  - id: gpt-4.1-nano
    provider: openai
    model: gpt-4.1-nano-2025-04-14
    api_key_env: OPENAI_API_KEY
    cost: {input_per_million: 0.10, output_per_million: 0.40}
    capabilities: {tools: true, json: true, vision: true, logprobs: true, context_window: 1047576, max_output_tokens: 32768}
    reliability: {quality: 0.60, success_rate: 0.99, tool_success_rate: 0.90, median_latency_ms: 600}

  - id: gpt-4.1-mini
    provider: openai
    model: gpt-4.1-mini-2025-04-14
    api_key_env: OPENAI_API_KEY
    cost: {input_per_million: 0.40, output_per_million: 1.60}
    capabilities: {tools: true, json: true, vision: true, logprobs: true, context_window: 1047576, max_output_tokens: 32768}
    reliability: {quality: 0.75, success_rate: 0.99, tool_success_rate: 0.95, median_latency_ms: 800}

  - id: gpt-4.1
    provider: openai
    model: gpt-4.1-2025-04-14
    api_key_env: OPENAI_API_KEY
    cost: {input_per_million: 2.00, output_per_million: 8.00}
    capabilities: {tools: true, json: true, vision: true, logprobs: true, context_window: 1047576, max_output_tokens: 32768}
    reliability: {quality: 0.85, success_rate: 0.99, tool_success_rate: 0.97, median_latency_ms: 1200}
