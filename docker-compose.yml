services:
  routemcp:
    build: .
    ports:
      - "8000:8000"
    environment:
      ROUTEMCP_API_KEY: ${ROUTEMCP_API_KEY:-}
      ROUTEMCP_STORE_PROMPTS: ${ROUTEMCP_STORE_PROMPTS:-false}
      ROUTEMCP_CIRCUIT_FAILURES: ${ROUTEMCP_CIRCUIT_FAILURES:-3}
      ROUTEMCP_CIRCUIT_COOLDOWN_SECONDS: ${ROUTEMCP_CIRCUIT_COOLDOWN_SECONDS:-30}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ${ROUTEMCP_CONFIG_FILE:-./models.example.yaml}:/app/models.yaml:ro
      - routemcp-data:/data
    restart: unless-stopped

  mcp:
    profiles: ["mcp"]
    build: .
    command: ["routemcp", "mcp", "--config", "/app/models.yaml", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      ROUTEMCP_DB: /data/routemcp.db
      ROUTEMCP_MCP_API_KEY: ${ROUTEMCP_MCP_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ${ROUTEMCP_CONFIG_FILE:-./models.example.yaml}:/app/models.yaml:ro
      - routemcp-data:/data
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  routemcp-data:
